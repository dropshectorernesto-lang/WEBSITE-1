name: Create four demo folders

on:
  push:
    paths:
      - '.github/workflows/create-four-demo-folders.yml'

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Copy customer template
        shell: bash
        run: |
          set -euo pipefail
          for slug in cancan-barcelona spa-posa-l-xulo-born branco-perruqueria-canina peluts-i-pelats-barceloneta; do
            test ! -e "demos/$slug"
            cp -R demos/_CUSTOMER-TEMPLATE "demos/$slug"
          done
          rm .github/workflows/create-four-demo-folders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos .github/workflows/create-four-demo-folders.yml
          git commit -m "Add four customer demo folders from template"
          git push origin HEAD:main
