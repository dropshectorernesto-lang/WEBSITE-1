name: QA booking system

on:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check JavaScript syntax
        run: |
          node --check demos/booking-system.js
          node --check demos/demo-global.js
          node --check demos/demo-system.js
          node --check api/bookings.js
          node --check api/availability.js
          node --check api/booking-action.js
          node --check demos/_CUSTOMER-TEMPLATE/profile.js

      - name: Verify shared booking inheritance
        run: |
          grep -q "booking-system.js" demos/demo-global.js
          grep -q "tier: 1" demos/_CUSTOMER-TEMPLATE/profile.js
          grep -q "submitPath: '/api/bookings'" demos/_CUSTOMER-TEMPLATE/profile.js
          grep -q "availabilityPath: '/api/availability'" demos/_CUSTOMER-TEMPLATE/profile.js
          grep -q "booking.requested" api/bookings.js
          grep -q "booking.status_changed" api/booking-action.js
          grep -q "tier_3_required" api/availability.js

      - name: Verify no customer secrets are committed
        run: |
          ! grep -R "hooks.zapier.com/hooks/catch/[0-9]" demos api --include='*.js'
          ! grep -R "BOOKING_ADMIN_TOKEN=" demos --include='*.js'

      - name: Verify protected source stayed untouched
        run: |
          BASE=867a771a8c8f7e4fbb60f6b7c9252c9e0d9a08a4
          git diff --name-only "$BASE"..HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -Ev '^(api/|demos/|BOOKING-SYSTEM\.md$|\.github/workflows/qa-booking-system\.yml$)' /tmp/changed.txt | grep -q .; then
            echo "Unexpected protected/root file change detected"
            grep -Ev '^(api/|demos/|BOOKING-SYSTEM\.md$|\.github/workflows/qa-booking-system\.yml$)' /tmp/changed.txt
            exit 1
          fi

      - name: Verify every demo still has all three modes
        run: |
          for dir in demos/*/; do
            name=$(basename "$dir")
            [ "$name" = "_CUSTOMER-TEMPLATE" ] && continue
            [ -f "$dir/index.html" ] || continue
            test -f "$dir/web/index.html"
            test -f "$dir/web-ipad/index.html"
            test -f "$dir/LIVE-DEMO.md"
          done
