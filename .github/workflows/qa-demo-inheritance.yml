name: QA demo inheritance

on:
  push:
    paths:
      - '.github/workflows/qa-demo-inheritance.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check all demo JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find demos -type f -name '*.js' -print0)

      - name: Verify shared inheritance layer
        shell: bash
        run: |
          set -euo pipefail
          grep -q "demo-system.js" demos/demo-global.js
          grep -q "personalized SEO/metadata" demos/FUTURE-DEMO-START-HERE.md
          grep -q "retroactive" demos/README.md
          grep -q "retroactive" demos/_CUSTOMER-TEMPLATE/README.md
          grep -q "Shared changes are retroactive" demos/_CUSTOMER-TEMPLATE/COPY-PASTE-PROMPT.md
          for lang in en de es ca; do
            grep -q "${lang}:" demos/_CUSTOMER-TEMPLATE/profile.js
            grep -q "${lang}:" demos/mai-friends/profile.js
          done

      - name: Verify every customer has all three modes and shared hooks
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for dir in demos/*/; do
            slug="$(basename "$dir")"
            case "$slug" in
              _CUSTOMER-TEMPLATE|profiles) continue ;;
            esac
            for required in index.html web/index.html web-ipad/index.html LIVE-DEMO.md; do
              if [[ ! -f "$dir$required" ]]; then
                echo "Missing $dir$required"
                failures=1
              fi
            done
            for wrapper in "$dir/index.html" "$dir/web/index.html" "$dir/web-ipad/index.html"; do
              [[ -f "$wrapper" ]] || continue
              if ! grep -Eq 'demo-global\.js|demo-runtime\.js' "$wrapper"; then
                echo "No shared demo hook in $wrapper"
                failures=1
              fi
            done
          done
          exit "$failures"

      - name: Verify legacy SEO coverage
        shell: bash
        run: |
          set -euo pipefail
          file=demos/demo-system.js
          for slug in mai-friends ban-kuvo art-gos bub-bub-scp bigotis lissy gusboral woodys la-pelu-montjuic amigo-mio laika marc-oliva midoki-maria-cubi animalades-gracia animals-amb-gracia bamboo-mascotas el-can-amb-gracia cris-perruqueria-canina-felina urban-pets buf-peluqueria-canina kololo-pets can-bau; do
            grep -q "'$slug'" "$file" || { echo "Missing SEO coverage for $slug"; exit 1; }
          done
          for slug in cancan-barcelona spa-posa-l-xulo-born branco-perruqueria-canina peluts-i-pelats-barceloneta mai-friends; do
            grep -q 'seo:' "demos/$slug/profile.js" || { echo "Missing explicit SEO profile for $slug"; exit 1; }
          done

      - name: Verify protected files stayed untouched
        shell: bash
        run: |
          set -euo pipefail
          base=d81dc4c6869f0b0295481f68392938c9d163c438
          changed="$(git diff --name-only "$base" --)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(assets/|mobile/|index\.html$|about\.html$|services\.html$|gallery\.html$|blog\.html$|contact\.html$|privacy-policy\.html$|terms-and-conditions\.html$|styles\.css$|reference\.css$|enhancements\.css$|script\.js$|site\.config\.js$|gallery-carousel\.js$|homepage-carousel\.js$)'; then
            echo 'Protected root/mobile/asset file changed unexpectedly.'
            exit 1
          fi

      - name: Confirm MAI FRIENDS is fully upgraded
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'profile.js' demos/mai-friends/index.html
          grep -q 'profile.js' demos/mai-friends/web/index.html
          grep -q 'profile.js' demos/mai-friends/web-ipad/index.html
          grep -q 'mai-friends/web/' demos/README.md
