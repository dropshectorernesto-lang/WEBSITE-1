name: Resolve demo map links

on:
  push:
    paths:
      - '.github/workflows/resolve-demo-map-links.yml'

permissions:
  contents: read

env:
  URL_1: https://maps.app.goo.gl/LS95snha8GhdzvkV7
  URL_2: https://maps.app.goo.gl/ExWrnosFeHwCeRpN9
  URL_3: https://maps.app.goo.gl/Rykkf4AQbNeWVD9B8

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve links
        shell: bash
        run: |
          set -euo pipefail
          : > resolved-map-links.txt
          for n in 1 2 3; do
            var="URL_${n}"
            short="${!var}"
            final="$(curl -A 'Mozilla/5.0' -LsS --max-redirs 15 --connect-timeout 15 --max-time 45 -o /dev/null -w '%{url_effective}' "$short")"
            printf '%s\t%s\n' "$short" "$final" >> resolved-map-links.txt
          done
          cat resolved-map-links.txt
      - name: Upload resolved links
        uses: actions/upload-artifact@v4
        with:
          name: resolved-demo-map-links
          path: resolved-map-links.txt
          retention-days: 1
