name: Temporary Apply Customer Demo Batch

on:
  push:
    paths:
      - '.github/workflows/resolve-map-links.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build new demos and remove retired demos
        shell: python
        run: |
          from pathlib import Path
          import json
          import re
          import shutil
          import urllib.parse

          template = Path('demos/_CUSTOMER-TEMPLATE')
          customers = [
            {
