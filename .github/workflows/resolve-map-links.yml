              'maps':'https://maps.app.goo.gl/zTAK4RWnoH7m9rJt5',
              'lat':41.382846,'lng':2.1306929,
              'kind':'dog'
            },
            {
              'slug':'ximena-leon-peluqueria-estetica-canina',
              'name':'Ximena leon peluqueria estética canina',
              'phoneDisplay':'+34 678 02 21 14',
              'phoneHref':'tel:+34678022114',
              'address1':'Rambla Catalana, 53',
              'address2':"08903 L’Hospitalet de Llobregat",
              'area':"L’Hospitalet de Llobregat",
              'maps':'https://maps.app.goo.gl/5nr2QB4XKcg2wxbXA',
              'lat':41.3705691,'lng':2.1243021,
              'kind':'dog'
            }
          ]

          def profile_for(c):
              name = c['name']
              area = c['area']
              address = f"{c['address1']}, {c['address2']}"
              if c['kind'] == 'pet':
                  service = {
                    'en':'pet grooming salon', 'de':'Salon für Tierpflege',
                    'es':'peluquería para mascotas', 'ca':'perruqueria per a mascotes'
                  }
                  service_value = {
                    'en':'Public listings identify this location as a pet grooming service.',
                    'de':'Öffentliche Einträge führen diesen Standort als Tierpflegeservice.',
                    'es':'Los directorios públicos identifican este local como servicio de peluquería para mascotas.',
                    'ca':'Els directoris públics identifiquen aquest local com a servei de perruqueria per a mascotes.'
                  }
              else:
                  service = {
                    'en':'dog grooming salon', 'de':'Hundesalon',
                    'es':'peluquería canina', 'ca':'perruqueria canina'
                  }
                  service_value = {
                    'en':'Public listings identify this location as a dog grooming service.',
                    'de':'Öffentliche Einträge führen diesen Standort als Hundesalon.',
                    'es':'Los directorios públicos identifican este local como servicio de peluquería canina.',
                    'ca':'Els directoris públics identifiquen aquest local com a servei de perruqueria canina.'
                  }

              copy = {
                'en': {
                  'hours':'CURRENT HOURS<br>CHECK GOOGLE MAPS',
                  'aboutHero':f"{name} is a {service['en']} in {area}.",
                  'story1':f"The salon is located at {address}. {service_value['en']}",
                  'story2':'For current opening hours, service details and appointment availability, contact the salon directly or open its Google Maps listing.',
                  'values':[
                    ['PET GROOMING',service_value['en']],
                    ['LOCAL SALON',f"The business is located in {area}."],
                    ['DIRECT CONTACT','The public business listing provides a direct phone number for the salon.'],
                    ['GOOGLE MAPS','Use the linked Google Maps profile for directions and current business information.']
                  ],
                  'reviews':[]
                },
                'de': {
                  'hours':'AKTUELLE ÖFFNUNGSZEITEN<br>BITTE GOOGLE MAPS PRÜFEN',
                  'aboutHero':f"{name} ist ein {service['de']} in {area}.",
                  'story1':f"Der Salon befindet sich in {address}. {service_value['de']}",
                  'story2':'Aktuelle Öffnungszeiten, Leistungen und Terminverfügbarkeit bitte direkt beim Salon oder über den Google-Maps-Eintrag prüfen.',
                  'values':[
                    ['TIERPFLEGE',service_value['de']],
                    ['LOKALER SALON',f"Der Betrieb befindet sich in {area}."],
                    ['DIREKTER KONTAKT','Der öffentliche Unternehmenseintrag enthält eine direkte Telefonnummer des Salons.'],
                    ['GOOGLE MAPS','Der verlinkte Google-Maps-Eintrag bietet Route und aktuelle Geschäftsinformationen.']
                  ],
                  'reviews':[]
                },
                'es': {
                  'hours':'HORARIO ACTUAL<br>CONSULTAR GOOGLE MAPS',
                  'aboutHero':f"{name} es una {service['es']} en {area}.",
                  'story1':f"El salón está en {address}. {service_value['es']}",
                  'story2':'Para confirmar horarios, servicios y disponibilidad de citas, contacta directamente con el salón o consulta su ficha de Google Maps.',
                  'values':[
                    ['PELUQUERÍA',service_value['es']],
                    ['SALÓN LOCAL',f"El negocio está ubicado en {area}."],
                    ['CONTACTO DIRECTO','La ficha pública del negocio incluye un teléfono directo del salón.'],
                    ['GOOGLE MAPS','Usa la ficha enlazada de Google Maps para llegar y consultar información actualizada.']
                  ],
                  'reviews':[]
                },
                'ca': {
                  'hours':'HORARI ACTUAL<br>CONSULTA GOOGLE MAPS',
                  'aboutHero':f"{name} és una {service['ca']} a {area}.",
                  'story1':f"El saló és a {address}. {service_value['ca']}",
                  'story2':'Per confirmar horaris, serveis i disponibilitat de cites, contacta directament amb el saló o consulta la seva fitxa de Google Maps.',
                  'values':[
                    ['PERRUQUERIA',service_value['ca']],
                    ['SALÓ LOCAL',f"El negoci és a {area}."],
                    ['CONTACTE DIRECTE','La fitxa pública del negoci inclou un telèfon directe del saló.'],
                    ['GOOGLE MAPS','Fes servir la fitxa enllaçada de Google Maps per arribar-hi i consultar informació actualitzada.']
                  ],
                  'reviews':[]
                }
              }

              city_label = "L’Hospitalet de Llobregat" if 'Hospitalet' in area else 'Barcelona'
              profile = {
                'name':name,
                'phoneDisplay':c['phoneDisplay'],
                'phoneHref':c['phoneHref'],
                'email':None,
                'social':None,
                'addressLine1':c['address1'],
                'addressLine2':c['address2'],
                'mapsUrl':c['maps'],
                'mapEmbed':f"https://www.google.com/maps?q={c['lat']},{c['lng']}&output=embed",
                'rating':None,
                'reviewCount':None,
                'booking':{
                  'tier':1,
                  'enabled':False,
                  'apiBase':None,
                  'submitPath':'/api/bookings',
                  'availabilityPath':'/api/availability',
                  'preferredWindows':['08:00-10:00','10:00-12:00','12:00-14:00','14:00-16:00','16:00-18:00','18:00-20:00','any']
                },
                'seo':{
                  'en':{'title':f"{name} | Dog Grooming · {city_label}",'description':f"{name} is a pet grooming business in {area}. View verified location and contact details."},
                  'de':{'title':f"{name} | Hundepflege · {city_label}",'description':f"{name} ist ein Tierpflegebetrieb in {area}. Standort und Kontaktdaten ansehen."},
                  'es':{'title':f"{name} | Peluquería canina · {city_label}",'description':f"{name} es un negocio de peluquería para mascotas en {area}. Consulta ubicación y datos de contacto."},
                  'ca':{'title':f"{name} | Perruqueria canina · {city_label}",'description':f"{name} és un negoci de perruqueria per a mascotes a {area}. Consulta la ubicació i les dades de contacte."}
                },
                'copy':copy
              }
              return "/* Customer-specific facts only. Shared behavior lives in demos/*.js. */\nwindow.DEMO_CUSTOMER = " + json.dumps(profile, ensure_ascii=False, indent=2) + ";\n"

          for c in customers:
              dest = Path('demos') / c['slug']
              if dest.exists():
                  print(f"SKIP existing demo: {c['slug']}")
                  continue
              shutil.copytree(template, dest)
              for extra in ('COPY-PASTE-PROMPT.md','README.md'):
                  p = dest / extra
                  if p.exists(): p.unlink()
              (dest / 'profile.js').write_text(profile_for(c), encoding='utf-8')
              base = f"https://dropshectorernesto-lang.github.io/WEBSITE-1/demos/{c['slug']}"
              live = f"""# {c['name']}

## [📱 Open Mobile Demo]({base}/)

## [🖥️ Open Web/Desktop Demo]({base}/web/)

## [📟 Open WEB IPAD Demo]({base}/web-ipad/)

Copy URLs:

`{base}/`

`{base}/web/`

`{base}/web-ipad/`

This demo inherits the shared EN/DE/ES/CA, WEB IPAD and booking system behavior. Booking stays in safe demo mode until a secure server endpoint is deployed and configured. The wrapper stays `noindex,nofollow`.
"""
              (dest / 'LIVE-DEMO.md').write_text(live, encoding='utf-8')
              print(f"ADD {c['slug']}")

          retired = [
            'bub-bub-scp','lissy','amigo-mio','midoki-maria-cubi',
            'animalades-gracia','cris-perruqueria-canina-felina'
          ]
          for slug in retired:
              p = Path('demos') / slug
              if p.exists():
                  shutil.rmtree(p)
                  print(f"DELETE {slug}")
              else:
                  print(f"ALREADY ABSENT {slug}")

          # Optional public facts must never fall back to the base GRÜM contact data.
          profile_js = Path('demos/customer-profile.js')
          text = profile_js.read_text(encoding='utf-8')
          old_email = "      if(c.email){const email=cards[1].querySelector('a,p');if(email){if(email.tagName==='A')email.href=`mailto:${c.email}`;email.textContent=c.email;}}\n"
          new_email = "      if(c.email){const email=cards[1].querySelector('a,p');if(email){if(email.tagName==='A')email.href=`mailto:${c.email}`;email.textContent=c.email;}}else if(cards[1]){cards[1].style.setProperty('display','none','important');}\n"
          if old_email not in text:
              raise SystemExit('Expected customer-profile email block not found')
          text = text.replace(old_email, new_email, 1)

          review_pattern = re.compile(r"    const section=doc\.querySelector\('\.reviews-section'\);\n    if\(section\)\{\n.*?\n    \}\n    replaceBrand\(doc\);", re.S)
          review_replacement = """    const section=doc.querySelector('.reviews-section');
    if(section){
      const reviews=Array.isArray(copy.reviews)?copy.reviews.filter(r=>Array.isArray(r)&&r.length>=2):[];
      const hasReviewMeta=c.rating!==null&&c.rating!==undefined&&c.rating!==''&&c.reviewCount!==null&&c.reviewCount!==undefined&&c.reviewCount!=='';
      if(!hasReviewMeta||!reviews.length){
        section.style.setProperty('display','none','important');
      }else{
        section.style.removeProperty('display');
        const kicker=section.querySelector(':scope > .section-width > .kicker');
        const ratingText=String(c.rating);
        const rating=lang==='en'?ratingText:ratingText.replace('.',',');
        if(kicker) kicker.textContent=`${labels[lang].reviews} · ${rating}/5 · ${c.reviewCount} ${lang==='de'?'BEWERTUNGEN':lang==='es'?'RESEÑAS':lang==='ca'?'RESSENYES':'REVIEWS'}`;
        [...section.querySelectorAll('.review-card')].forEach((card,i)=>{
          const r=reviews[i%reviews.length];
          const p=card.querySelector('p'),s=card.querySelector('strong'),label=card.querySelector('span');
          if(p)p.textContent=r[1]; if(s)s.textContent=r[0]; if(label)label.textContent=labels[lang].review;
        });
      }
    }
    replaceBrand(doc);"""
          text2, count = review_pattern.subn(review_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one customer-profile review block, replaced {count}')
          profile_js.write_text(text2, encoding='utf-8')

          # Remove this temporary workflow from the final repository state.
          wf = Path('.github/workflows/resolve-map-links.yml')
          if wf.exists(): wf.unlink()

      - name: Commit batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dropshectorernesto-lang"
          git config user.email "dropshectorernesto@gmail.com"
          git add -A
          git status --short
          git commit -m "Add nine customer demos and remove retired demos"
          git push origin HEAD:main
