<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Bookings</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f5f2}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:0 auto;padding:28px 20px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.top h1{margin:0;font-size:30px;letter-spacing:-.04em}.controls{display:flex;gap:8px;align-items:center}button,select,input{font:inherit}.btn{border:1px solid #171717;background:#171717;color:#fff;border-radius:999px;padding:10px 16px;cursor:pointer}.btn.secondary{background:#fff;color:#171717}.btn.ghost{background:transparent;color:#171717;border-color:#ccc}.statusline{min-height:24px;margin:0 0 16px;color:#666}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{border:1px solid #d6d6d0;background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}.filter.active{background:#171717;color:#fff;border-color:#171717}.list{display:grid;gap:12px}.empty{padding:48px 20px;text-align:center;color:#777;background:#fff;border:1px dashed #ccc;border-radius:18px}.login{position:fixed;inset:0;background:rgba(245,245,242,.97);display:grid;place-items:center;padding:20px;z-index:10}.login.hidden{display:none}.loginbox{width:min(420px,100%);background:#fff;border:1px solid #d8d8d2;border-radius:20px;padding:24px}.loginbox h2{margin:0 0 8px;font-size:24px}.loginbox p{margin:0 0 18px;color:#666}.muted{color:#777}.locale{border:1px solid #ccc;border-radius:999px;background:#fff;padding:8px 10px}@media(max-width:680px){.top{align-items:flex-start}.controls{flex-wrap:wrap;justify-content:flex-end}.shell{padding:20px 14px 60px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div><h1 data-t="title">Bookings</h1><div class="muted" id="businessLabel">Demo</div></div>
      <div class="controls">
        <select id="locale" class="locale" aria-label="Language"><option value="en">EN</option><option value="de">DE</option><option value="es">ES</option><option value="ca">CA</option></select>
        <button class="btn secondary" id="reload" data-t="refresh">Refresh</button>
        <button class="btn ghost" id="logout" data-t="logout">Exit</button>
      </div>
    </header>
    <p class="statusline" id="statusline"></p>
    <div class="toolbar" id="filters"></div>
    <main class="list" id="list"></main>
  </div>

  <section class="login" id="login">
    <form class="loginbox" id="loginForm">
      <h2 data-t="loginTitle">Booking dashboard</h2>
      <p data-t="loginCopy">Demo access — no login required for now.</p>
      <button class="btn" type="submit" data-t="openDashboard">Enter dashboard</button>
    </form>
  </section>

<script>
(() => {
  const COPY = {
    en:{title:'Bookings',refresh:'Refresh',logout:'Exit',loginTitle:'Booking dashboard',loginCopy:'Demo access — no login required for now.',openDashboard:'Enter dashboard',all:'All',new:'New',confirmed:'Confirmed',cancelled:'Cancelled',completed:'Done',noBookings:'No booking requests yet.'},
    de:{title:'Buchungen',refresh:'Aktualisieren',logout:'Verlassen',loginTitle:'Buchungsübersicht',loginCopy:'Demo-Zugang — vorerst ohne Anmeldung.',openDashboard:'Dashboard öffnen',all:'Alle',new:'Neu',confirmed:'Bestätigt',cancelled:'Storniert',completed:'Erledigt',noBookings:'Noch keine Buchungsanfragen.'},
    es:{title:'Reservas',refresh:'Actualizar',logout:'Salir',loginTitle:'Panel de reservas',loginCopy:'Acceso de demo — por ahora sin inicio de sesión.',openDashboard:'Entrar al panel',all:'Todas',new:'Nueva',confirmed:'Confirmada',cancelled:'Cancelada',completed:'Hecha',noBookings:'Todavía no hay solicitudes.'},
    ca:{title:'Reserves',refresh:'Actualitza',logout:'Surt',loginTitle:'Panell de reserves',loginCopy:'Accés de demostració — de moment sense iniciar sessió.',openDashboard:'Entra al panell',all:'Totes',new:'Nova',confirmed:'Confirmada',cancelled:'Cancel·lada',completed:'Feta',noBookings:'Encara no hi ha sol·licituds.'}
  };
  const state={filter:'all',locale:'en'};
  const login=document.getElementById('login');
  const form=document.getElementById('loginForm');
  const list=document.getElementById('list');
  const filters=document.getElementById('filters');
  const locale=document.getElementById('locale');
  const label=document.getElementById('businessLabel');
  const params=new URLSearchParams(location.search);
  label.textContent=params.get('business') || 'Demo';

  const lang=()=>COPY[state.locale] || COPY.en;
  const render=()=>{
    const items=['all','new','confirmed','cancelled','completed'];
    filters.innerHTML=items.map(item=>`<button class="filter ${state.filter===item?'active':''}" data-filter="${item}">${lang()[item]}</button>`).join('');
    filters.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{state.filter=button.dataset.filter;render();}));
    list.innerHTML=`<div class="empty">${lang().noBookings}</div>`;
  };
  const setLocale=(value)=>{
    state.locale=COPY[value]?value:'en';
    document.documentElement.lang=state.locale;
    locale.value=state.locale;
    document.querySelectorAll('[data-t]').forEach(el=>{const key=el.dataset.t;if(lang()[key])el.textContent=lang()[key];});
    render();
  };

  form.addEventListener('submit',event=>{event.preventDefault();login.classList.add('hidden');});
  document.getElementById('logout').addEventListener('click',()=>login.classList.remove('hidden'));
  document.getElementById('reload').addEventListener('click',()=>render());
  locale.addEventListener('change',()=>setLocale(locale.value));
  const browserLang=(navigator.language||'en').slice(0,2).toLowerCase();
  setLocale(COPY[browserLang]?browserLang:'en');
})();
</script>
</body>
</html>
