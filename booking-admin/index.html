<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Bookings</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f5f2}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:0 auto;padding:28px 20px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.top h1{margin:0;font-size:30px;letter-spacing:-.04em}.controls{display:flex;gap:8px;align-items:center}button,select,input{font:inherit}.btn{border:1px solid #171717;background:#171717;color:#fff;border-radius:999px;padding:10px 16px;cursor:pointer}.btn.secondary{background:#fff;color:#171717}.btn.ghost{background:transparent;color:#171717;border-color:#ccc}.btn.danger{background:#fff;color:#9f1c1c;border-color:#d9bcbc}.btn:disabled{opacity:.45;cursor:not-allowed}.statusline{min-height:24px;margin:0 0 16px;color:#666}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{border:1px solid #d6d6d0;background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}.filter.active{background:#171717;color:#fff;border-color:#171717}.list{display:grid;gap:12px}.card{background:#fff;border:1px solid #deded8;border-radius:18px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}.mainline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.name{font-size:18px;font-weight:700}.pill{font-size:12px;padding:5px 8px;border-radius:999px;background:#efefe9;text-transform:uppercase;letter-spacing:.04em}.meta{margin-top:8px;color:#60605a;display:flex;gap:10px 16px;flex-wrap:wrap;font-size:14px}.window{font-weight:700;color:#171717}.details{grid-column:1/-1;border-top:1px solid #eee;padding-top:16px;display:none}.card.open .details{display:block}.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#777}.field input{width:100%;border:1px solid #ccc;border-radius:10px;padding:10px;background:#fff}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.warning{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff5d9;color:#654b00;font-size:13px}.warning.show{display:block}.empty{padding:48px 20px;text-align:center;color:#777;background:#fff;border:1px dashed #ccc;border-radius:18px}.login{position:fixed;inset:0;background:rgba(245,245,242,.97);display:grid;place-items:center;padding:20px;z-index:10}.login.hidden{display:none}.loginbox{width:min(420px,100%);background:#fff;border:1px solid #d8d8d2;border-radius:20px;padding:24px}.loginbox h2{margin:0 0 8px;font-size:24px}.loginbox p{margin:0 0 18px;color:#666}.loginbox label{display:grid;gap:6px;margin:12px 0}.loginbox input{border:1px solid #ccc;border-radius:10px;padding:11px}.loginerror{min-height:20px;color:#9f1c1c;font-size:13px}.muted{color:#777}.locale{border:1px solid #ccc;border-radius:999px;background:#fff;padding:8px 10px}@media(max-width:680px){.card{grid-template-columns:1fr}.card>.btn{justify-self:start}.detailgrid{grid-template-columns:1fr}.wide{grid-column:auto}.top{align-items:flex-start}.controls{flex-wrap:wrap;justify-content:flex-end}.shell{padding:20px 14px 60px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div><h1 data-t="title">Bookings</h1><div class="muted" id="businessLabel"></div></div>
      <div class="controls">
        <select id="locale" class="locale" aria-label="Language"><option value="en">EN</option><option value="de">DE</option><option value="es">ES</option><option value="ca">CA</option></select>
        <button class="btn secondary" id="reload" data-t="refresh">Refresh</button>
        <button class="btn ghost" id="logout" data-t="logout">Log out</button>
      </div>
    </header>
    <p class="statusline" id="statusline"></p>
    <div class="toolbar" id="filters"></div>
    <main class="list" id="list"></main>
  </div>

  <section class="login" id="login">
    <form class="loginbox" id="loginForm">
      <h2 data-t="loginTitle">Booking dashboard</h2>
      <p data-t="loginCopy">Enter the salon access key.</p>
      <label id="businessField"><span data-t="business">Business</span><input id="business" autocomplete="organization" required /></label>
      <label><span data-t="accessKey">Access key</span><input id="token" type="password" autocomplete="current-password" required /></label>
      <div class="loginerror" id="loginerror"></div>
      <button class="btn" type="submit" data-t="openDashboard">Open dashboard</button>
    </form>
  </section>

<script>
(() => {
  const COPY = {
    en:{title:'Bookings',refresh:'Refresh',logout:'Log out',loginTitle:'Booking dashboard',loginCopy:'Enter the salon access key.',business:'Business',accessKey:'Access key',openDashboard:'Open dashboard',all:'All',new:'New',confirmed:'Confirmed',cancelled:'Cancelled',completed:'Done',requested:'Requested',preferred:'Preferred',service:'Service',contact:'Contact',notes:'Notes',exactDate:'Appointment date',exactTime:'Exact time',confirm:'Confirm booking',cancel:'Cancel',done:'Mark done',outside:'This exact time is outside the customer’s preferred window.',noBookings:'No booking requests yet.',loading:'Loading bookings…',saved:'Booking updated.',error:'Could not load the bookings. Check the connection and access key.',confirmError:'Could not update this booking.',noPreference:'No preference'},
    de:{title:'Buchungen',refresh:'Aktualisieren',logout:'Abmelden',loginTitle:'Buchungsübersicht',loginCopy:'Zugangsschlüssel des Salons eingeben.',business:'Salon',accessKey:'Zugangsschlüssel',openDashboard:'Dashboard öffnen',all:'Alle',new:'Neu',confirmed:'Bestätigt',cancelled:'Storniert',completed:'Erledigt',requested:'Gewünscht',preferred:'Zeitfenster',service:'Service',contact:'Kontakt',notes:'Notizen',exactDate:'Termin-Datum',exactTime:'Genaue Uhrzeit',confirm:'Buchung bestätigen',cancel:'Stornieren',done:'Erledigt',outside:'Diese Uhrzeit liegt außerhalb des gewünschten Zeitfensters.',noBookings:'Noch keine Buchungsanfragen.',loading:'Buchungen werden geladen…',saved:'Buchung aktualisiert.',error:'Buchungen konnten nicht geladen werden. Verbindung und Zugangsschlüssel prüfen.',confirmError:'Buchung konnte nicht aktualisiert werden.',noPreference:'Keine Präferenz'},
    es:{title:'Reservas',refresh:'Actualizar',logout:'Cerrar sesión',loginTitle:'Panel de reservas',loginCopy:'Introduce la clave de acceso del salón.',business:'Negocio',accessKey:'Clave de acceso',openDashboard:'Abrir panel',all:'Todas',new:'Nueva',confirmed:'Confirmada',cancelled:'Cancelada',completed:'Hecha',requested:'Solicitado',preferred:'Franja preferida',service:'Servicio',contact:'Contacto',notes:'Notas',exactDate:'Fecha de la cita',exactTime:'Hora exacta',confirm:'Confirmar reserva',cancel:'Cancelar',done:'Marcar hecha',outside:'Esta hora está fuera de la franja preferida del cliente.',noBookings:'Todavía no hay solicitudes.',loading:'Cargando reservas…',saved:'Reserva actualizada.',error:'No se pudieron cargar las reservas. Revisa la conexión y la clave.',confirmError:'No se pudo actualizar esta reserva.',noPreference:'Sin preferencia'},
    ca:{title:'Reserves',refresh:'Actualitza',logout:'Tanca sessió',loginTitle:'Panell de reserves',loginCopy:'Introdueix la clau d’accés del saló.',business:'Negoci',accessKey:'Clau d’accés',openDashboard:'Obre el panell',all:'Totes',new:'Nova',confirmed:'Confirmada',cancelled:'Cancel·lada',completed:'Feta',requested:'Sol·licitat',preferred:'Franja preferida',service:'Servei',contact:'Contacte',notes:'Notes',exactDate:'Data de la cita',exactTime:'Hora exacta',confirm:'Confirma reserva',cancel:'Cancel·la',done:'Marca feta',outside:'Aquesta hora és fora de la franja preferida del client.',noBookings:'Encara no hi ha sol·licituds.',loading:'Carregant reserves…',saved:'Reserva actualitzada.',error:'No s’han pogut carregar les reserves. Revisa la connexió i la clau.',confirmError:'No s’ha pogut actualitzar aquesta reserva.',noPreference:'Sense preferència'}
  };

  const qs = new URLSearchParams(location.search);
  const fixedBusiness = (qs.get('business') || '').trim().toLowerCase();
  const apiBase = (qs.get('api') || '').trim().replace(/\/$/, '');
  const state = { bookings:[], filter:'all', business:fixedBusiness, token:'', locale:'en' };
  const els = { login:document.getElementById('login'), loginForm:document.getElementById('loginForm'), business:document.getElementById('business'), businessField:document.getElementById('businessField'), token:document.getElementById('token'), loginerror:document.getElementById('loginerror'), list:document.getElementById('list'), filters:document.getElementById('filters'), status:document.getElementById('statusline'), label:document.getElementById('businessLabel'), locale:document.getElementById('locale') };

  const lang = () => COPY[state.locale] || COPY.en;
  const api = (path) => `${apiBase}${path}`;
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const statusLabel = (status) => lang()[status] || status;
  const windowLabel = (value) => !value || value === 'any' ? lang().noPreference : String(value).replace('-', '–');

  const setLocale = (value) => {
    state.locale = COPY[value] ? value : 'en';
    document.documentElement.lang = state.locale;
    els.locale.value = state.locale;
    document.querySelectorAll('[data-t]').forEach((el) => { const key = el.dataset.t; if (lang()[key]) el.textContent = lang()[key]; });
    renderFilters(); render();
  };

  const minutes = (value) => {
    const match = /^(\d{2}):(\d{2})$/.exec(String(value || ''));
    return match ? Number(match[1]) * 60 + Number(match[2]) : null;
  };
  const outsideWindow = (time, range) => {
    if (!range || range === 'any') return false;
    const match = /^(\d{2}:\d{2})-(\d{2}:\d{2})$/.exec(range);
    if (!match) return false;
    const exact = minutes(time), start = minutes(match[1]), end = minutes(match[2]);
    return exact !== null && start !== null && end !== null && (exact < start || exact > end);
  };

  const renderFilters = () => {
    const items = ['all','new','confirmed','cancelled','completed'];
    els.filters.innerHTML = items.map((item) => `<button class="filter ${state.filter === item ? 'active' : ''}" data-filter="${item}">${escapeHtml(statusLabel(item))}</button>`).join('');
    els.filters.querySelectorAll('[data-filter]').forEach((button) => button.addEventListener('click', () => { state.filter = button.dataset.filter; renderFilters(); render(); }));
  };

  const render = () => {
    const rows = state.bookings.filter((booking) => state.filter === 'all' || booking.status === state.filter);
    if (!rows.length) { els.list.innerHTML = `<div class="empty">${escapeHtml(lang().noBookings)}</div>`; return; }
    els.list.innerHTML = rows.map((booking) => {
      const a = booking.appointment || {}, c = booking.customer || {}, p = booking.pet || {};
      const exactDate = a.confirmedDate || a.requestedDate || '';
      const exactTime = a.confirmedTime || a.requestedTime || '';
      return `<article class="card" data-card="${escapeHtml(booking.id)}">
        <div>
          <div class="mainline"><span class="name">${escapeHtml(c.name || '')} · ${escapeHtml(p.name || '')}</span><span class="pill">${escapeHtml(statusLabel(booking.status || 'new'))}</span></div>
          <div class="meta"><span>${escapeHtml(lang().service)}: <strong>${escapeHtml(a.service || '')}</strong></span><span>${escapeHtml(lang().requested)}: <strong>${escapeHtml(a.requestedDate || '')}</strong></span><span class="window">${escapeHtml(lang().preferred)}: ${escapeHtml(windowLabel(a.preferredWindow))}</span></div>
        </div>
        <button class="btn secondary" data-open="${escapeHtml(booking.id)}">Open</button>
        <div class="details">
          <div class="detailgrid">
            <div class="field"><span>${escapeHtml(lang().contact)}</span><div>${escapeHtml(c.phone || '')}<br>${escapeHtml(c.email || '')}</div></div>
            <div class="field"><span>${escapeHtml(lang().service)}</span><div>${escapeHtml(a.service || '')}</div></div>
            <div class="field wide"><span>${escapeHtml(lang().notes)}</span><div>${escapeHtml(booking.notes || '—')}</div></div>
            <label class="field"><span>${escapeHtml(lang().exactDate)}</span><input type="date" data-date value="${escapeHtml(exactDate)}"></label>
            <label class="field"><span>${escapeHtml(lang().exactTime)}</span><input type="time" step="900" data-time value="${escapeHtml(exactTime)}"></label>
          </div>
          <div class="warning" data-warning>${escapeHtml(lang().outside)}</div>
          <div class="actions">
            <button class="btn" data-action="confirm">${escapeHtml(lang().confirm)}</button>
            <button class="btn ghost" data-action="complete">${escapeHtml(lang().done)}</button>
            <button class="btn danger" data-action="cancel">${escapeHtml(lang().cancel)}</button>
          </div>
        </div>
      </article>`;
    }).join('');

    els.list.querySelectorAll('[data-open]').forEach((button) => button.addEventListener('click', () => button.closest('.card').classList.toggle('open')));
    els.list.querySelectorAll('.card').forEach((card) => {
      const booking = state.bookings.find((item) => item.id === card.dataset.card);
      const timeInput = card.querySelector('[data-time]');
      const warning = card.querySelector('[data-warning]');
      const updateWarning = () => warning.classList.toggle('show', outsideWindow(timeInput.value, booking?.appointment?.preferredWindow));
      timeInput.addEventListener('input', updateWarning); updateWarning();
      card.querySelectorAll('[data-action]').forEach((button) => button.addEventListener('click', () => act(booking, button.dataset.action, card)));
    });
  };

  const load = async () => {
    els.status.textContent = lang().loading;
    try {
      const response = await fetch(api(`/api/bookings?businessSlug=${encodeURIComponent(state.business)}`), { headers:{ Authorization:`Bearer ${state.token}` } });
      if (!response.ok) throw new Error('load_failed');
      const payload = await response.json();
      state.bookings = Array.isArray(payload.bookings) ? payload.bookings : [];
      sessionStorage.setItem('bookingBusiness', state.business);
      sessionStorage.setItem('bookingToken', state.token);
      els.login.classList.add('hidden');
      els.label.textContent = state.business;
      els.status.textContent = '';
      renderFilters(); render();
    } catch (_) {
      els.status.textContent = '';
      els.loginerror.textContent = lang().error;
      els.login.classList.remove('hidden');
    }
  };

  const act = async (booking, action, card) => {
    const date = card.querySelector('[data-date]').value;
    const time = card.querySelector('[data-time]').value;
    if (action === 'confirm' && (!date || !time)) return;
    const buttons = card.querySelectorAll('[data-action]'); buttons.forEach((button) => button.disabled = true);
    try {
      const response = await fetch(api('/api/booking-action'), {
        method:'POST',
        headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${state.token}` },
        body:JSON.stringify({ businessSlug:state.business, bookingId:booking.id, action, date, time })
      });
      if (!response.ok) throw new Error('action_failed');
      els.status.textContent = lang().saved;
      await load();
    } catch (_) {
      els.status.textContent = lang().confirmError;
    } finally {
      buttons.forEach((button) => button.disabled = false);
    }
  };

  els.loginForm.addEventListener('submit', (event) => {
    event.preventDefault();
    state.business = (fixedBusiness || els.business.value).trim().toLowerCase();
    state.token = els.token.value;
    els.loginerror.textContent = '';
    load();
  });
  document.getElementById('reload').addEventListener('click', load);
  document.getElementById('logout').addEventListener('click', () => { sessionStorage.removeItem('bookingToken'); sessionStorage.removeItem('bookingBusiness'); state.token=''; els.token.value=''; els.login.classList.remove('hidden'); });
  els.locale.addEventListener('change', () => setLocale(els.locale.value));

  const browserLang = (navigator.language || 'en').slice(0,2).toLowerCase();
  setLocale(COPY[browserLang] ? browserLang : 'en');
  if (fixedBusiness) { state.business = fixedBusiness; els.businessField.style.display = 'none'; els.business.required = false; } else { els.business.value = sessionStorage.getItem('bookingBusiness') || ''; }
  const savedToken = sessionStorage.getItem('bookingToken');
  if (savedToken && (fixedBusiness || els.business.value)) { state.token = savedToken; state.business = fixedBusiness || els.business.value.trim().toLowerCase(); load(); }
})();
</script>
</body>
</html>
