<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#f3ebe7" />
  <title>Customer Demos</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#222;background:#f3ebe7}
    *{box-sizing:border-box}
    body{margin:0;padding:28px 18px 42px}
    main{max-width:760px;margin:0 auto}
    h1{margin:0 0 8px;font-size:34px;line-height:1;color:#01463c}
    p{margin:0 0 24px;color:#5a514b;font-size:14px;line-height:1.5}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
    a{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:0 18px;border-radius:18px;background:#fff;color:#01463c;text-decoration:none;font-weight:800;box-shadow:0 8px 22px rgba(41,29,24,.08)}
    a::after{content:'→';font-size:20px;color:#f87686}
  </style>
</head>
<body>
<main>
  <h1>Customer Demos</h1>
  <p>Tap a customer to open the current mobile demo.</p>
  <div class="grid">
    <a href="mai-friends/">MAI FRIENDS</a>
    <a href="ban-kuvo/">BAN KUVO</a>
    <a href="art-gos/">ART GOS</a>
    <a href="bub-bub-scp/">BUB BUB SCP</a>
    <a href="bigotis/">BIGOTIS</a>
    <a href="lissy/">LISSY</a>
    <a href="gusboral/">GUSBORAL</a>
    <a href="woodys/">WOODYS</a>
    <a href="amigo-mio/">AMIGO MIO</a>
    <a href="laika/">LAIKA</a>
    <a href="marc-oliva/">MARC OLIVA</a>
  </div>
</main>
</body>
</html>
