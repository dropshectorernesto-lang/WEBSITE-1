<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#f3ebe7" />
  <title>Grüm Demo</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f3ebe7;overflow:hidden}
    iframe{display:block;width:100%;height:100dvh;border:0;background:#f3ebe7}
    .fallback{position:fixed;inset:auto 12px 12px;z-index:2;text-align:center;font:12px Arial,sans-serif}
    .fallback a{color:#01463c}
  </style>
</head>
<body>
  <iframe src="../../mobile/index.html" title="Customer website demo" allow="fullscreen" loading="eager"></iframe>
  <div class="fallback"><a href="../../mobile/index.html">Open demo directly</a></div>
  <script>
    const slug = location.pathname.split('/').filter(Boolean).at(-1) || 'demo';
    const name = slug.split('-').map(word => word.toUpperCase()).join(' ');
    document.title = `${name} — Grüm Demo`;
  </script>
</body>
</html>
