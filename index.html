<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f5ede6" />
  <meta name="description" content="Reusable service business website template" />
  <title>Service Business Template</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="reference.css" />
</head>
<body>

  <!-- SECTION 00 — HEADER / NAVIGATION -->
  <header class="site-header" id="home" data-section="header">
    <a class="brand" href="#home" aria-label="Home" data-bind="business.name">Brand</a>
    <nav class="main-nav" aria-label="Main navigation" id="main-nav"></nav>
    <button class="btn btn-primary btn-header" data-book>
      <span class="phone-icon" aria-hidden="true"></span>
      <span data-bind="hero.primaryButton">BOOK APPOINTMENT</span>
    </button>
  </header>

  <main>
    <!-- SECTION 01 — HERO -->
    <section class="hero section-width" data-section="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title" data-bind-html="hero.headlineHtml"></h1>
        <p data-bind="hero.subtitle"></p>
        <div class="hero-actions">
          <button class="btn btn-primary" data-book><span class="phone-icon" aria-hidden="true"></span><span data-bind="hero.primaryButton"></span></button>
          <button class="btn btn-secondary" data-video><span class="play-dot" aria-hidden="true"></span><span data-bind="hero.secondaryButton"></span></button>
        </div>
      </div>
      <div class="hero-image-wrap"><img data-bind-src="hero.image" data-bind-alt="hero.imageAlt" fetchpriority="high" /></div>
      <div class="bubble b1" aria-hidden="true"></div><div class="bubble b2" aria-hidden="true"></div><div class="bubble b3" aria-hidden="true"></div><div class="bubble b4" aria-hidden="true"></div><div class="bubble b5" aria-hidden="true"></div>
      <div class="care-chip"><span class="paw" aria-hidden="true"></span><div><strong data-bind="hero.chipTitle"></strong><small data-bind-html="hero.chipTextHtml"></small></div></div>
    </section>

    <!-- SECTION 02 — SERVICES -->
    <section class="services" id="services" data-section="services">
      <div class="section-width services-inner">
        <div class="services-head">
          <div><p class="kicker" data-bind="services.kicker"></p><h2 data-bind-html="services.headingHtml"></h2></div>
          <div class="services-intro"><p data-bind-html="services.introHtml"></p><a href="#service-cards"><span data-bind="services.linkLabel"></span><i aria-hidden="true"></i></a></div>
        </div>
        <div class="service-cards" id="service-cards"></div>
        <div class="pager" aria-hidden="true"><span></span><span></span><b></b><span></span><span></span></div>
      </div>
    </section>

    <!-- SECTION 03 — EXPERIENCE / ABOUT -->
    <section class="experience" id="experience" data-section="experience">
      <div class="experience-img"><img data-bind-src="experience.image" data-bind-alt="experience.imageAlt" loading="lazy" /></div>
      <div class="experience-copy"><p class="kicker" data-bind="experience.kicker"></p><h2 data-bind-html="experience.headingHtml"></h2><button class="btn btn-primary" data-about><span data-bind="experience.button"></span><i aria-hidden="true"></i></button></div>
    </section>

    <!-- SECTION 04 — SOCIAL / GALLERY -->
    <section class="gallery" id="gallery" data-section="gallery">
      <div class="section-width gallery-inner">
        <img class="phone-mock" data-bind-src="gallery.phoneImage" data-bind-alt="gallery.phoneAlt" loading="lazy" />
        <div class="gallery-title"><p class="kicker" data-bind="gallery.kicker"></p><h2 data-bind="gallery.heading"></h2></div>
        <a class="gallery-more" id="gallery-link" target="_blank" rel="noreferrer"><span data-bind="gallery.linkLabel"></span><i aria-hidden="true"></i></a>
        <div class="ig-grid" id="ig-grid"></div>
      </div>
    </section>

    <!-- SECTION 05 — FINAL CTA / CONTACT -->
    <section class="final-cta" id="contact" data-section="final-cta">
      <div class="section-width final-inner">
        <div class="final-copy"><p class="kicker" data-bind="finalCta.kicker"></p><h2 data-bind="finalCta.heading"></h2><p data-bind="finalCta.body"></p></div>
        <div class="final-dog"><img data-bind-src="finalCta.image" data-bind-alt="finalCta.imageAlt" loading="lazy" /></div>
        <button class="btn btn-primary final-book" data-book><span class="phone-icon" aria-hidden="true"></span><strong data-bind="finalCta.button"></strong><small data-bind="finalCta.buttonSmall"></small></button>
      </div>
    </section>
  </main>

  <!-- BOOKING MODAL -->
  <dialog class="modal" id="bookingModal">
    <form method="dialog" id="bookingForm">
      <button class="modal-close" value="cancel" aria-label="Close">×</button>
      <p class="kicker" data-bind="booking.kicker"></p><h2 data-bind="booking.heading"></h2>
      <div class="form-grid">
        <label>Your name<input required name="name" autocomplete="name" /></label>
        <label>Pet / customer name<input required name="subject" /></label>
        <label>Phone<input required name="phone" autocomplete="tel" /></label>
        <label>Service<select name="service" id="serviceSelect"></select></label>
        <label class="full">Anything we should know?<textarea name="notes" placeholder="Details, preferred date…"></textarea></label>
      </div>
      <button class="btn btn-primary submit" value="default" data-bind="booking.submitLabel"></button>
    </form>
  </dialog>

  <dialog class="modal video-modal" id="videoModal">
    <button class="modal-close" data-close-video aria-label="Close">×</button>
    <p class="kicker" data-bind="experience.kicker"></p><h2 data-bind-html="experience.headingHtml"></h2>
    <div class="video-placeholder"><button aria-label="Play">▶</button></div>
  </dialog>

  <script src="site.config.js"></script>
  <script src="script.js"></script>
</body>
</html>
