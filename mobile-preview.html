<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile Preview</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#d9d0c9;font-family:Arial,sans-serif}
.frame{width:390px;height:844px;border:14px solid #111;border-radius:38px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35);background:white}
iframe{width:390px;height:844px;border:0;display:block;background:white}
</style></head><body><div class="frame"><iframe id="phone" src="/index.html?v=mobile-banners-1"></iframe></div><script>
const params=new URLSearchParams(location.search);
const v=params.get('v')||'mobile-banners-21';
const page=(params.get('page')||'index.html').replace(/^\//,'');
const phone=document.getElementById('phone');
const loadInPhone=(href)=>{phone.src='/' + href.replace(/^\//,'').split('?')[0] + '?v=' + encodeURIComponent(v);};
loadInPhone(page);
phone.addEventListener('load',()=>{
  try{
    const doc=phone.contentDocument;
    doc.querySelectorAll('a[href]').forEach(link=>{
      link.addEventListener('click',event=>{
        const href=link.getAttribute('href');
        if(!href || href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('tel:') || link.dataset.legalLink) return;
        event.preventDefault();
        loadInPhone(href);
      });
    });
  }catch(error){}
});
</script></body></html>
