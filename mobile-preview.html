<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mobile Preview</title>
  <style>
    html,body{margin:0;min-height:100%;background:#d9d0c9}
    body{min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;overflow:auto}
    .frame{width:390px;height:844px;border:14px solid #111;border-radius:38px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35);background:white}
    #phone{width:390px;height:844px;border:0;display:block;background:white}
    @media(max-width:430px){body{display:block;background:#fff}.frame{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}.frame,#phone{width:100vw;height:100dvh}}
  </style>
</head>
<body>
  <div class="frame"><iframe id="phone" title="Grüm mobile website"></iframe></div>
  <script>
    const params=new URLSearchParams(location.search);
    const v=params.get('v')||'mobile-preview-stable-1';
    const phone=document.getElementById('phone');
    const normalizePage=(value='index.html')=>{
      let page=String(value||'index.html').split('#')[0].split('?')[0].replace(/^\/+/, '');
      const repoMarker='/WEBSITE-1/';
      const markerIndex=page.indexOf(repoMarker);
      if(markerIndex>=0){
        const remainder=page.slice(markerIndex+repoMarker.length);
        const parts=remainder.split('/');
        if(parts.length>1 && /^[0-9a-f]{7,40}$/i.test(parts[0])) parts.shift();
        page=parts.join('/');
      }
      return page||'index.html';
    };
    const loadInPhone=(href)=>{
      const page=normalizePage(href);
      const url=new URL('./'+page, location.href);
      url.searchParams.set('v',v);
      phone.src=url.href;
    };
    const stabilizeDocument=()=>{
      try{
        const doc=phone.contentDocument;
        if(!doc) return;

        let style=doc.getElementById('mobile-preview-stability');
        if(!style){
          style=doc.createElement('style');
          style.id='mobile-preview-stability';
          style.textContent=`
            @media(max-width:560px){
              .final-dog>img{opacity:1!important;visibility:visible!important;display:block!important}
              .final-dog.has-mobile-rig>img{opacity:1!important}
              .mobile-dog-rig{opacity:0!important;transition:opacity .2s ease!important}
              .mobile-dog-rig.preview-rig-ready{opacity:1!important}
            }
          `;
          doc.head.appendChild(style);
        }

        const rig=doc.querySelector('.mobile-dog-rig');
        if(rig){
          rig.setAttribute('loading','lazy');
          const markReady=()=>rig.classList.add('preview-rig-ready');
          if(rig.contentDocument?.readyState==='complete') markReady();
          else rig.addEventListener('load',markReady,{once:true});
        }

        doc.querySelectorAll('a[href]').forEach(link=>{
          if(link.dataset.mobilePreviewBound) return;
          link.dataset.mobilePreviewBound='1';
          link.addEventListener('click',event=>{
            const href=link.getAttribute('href');
            if(!href || href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('tel:') || link.dataset.legalLink) return;
            event.preventDefault();
            loadInPhone(href);
          });
        });
      }catch(error){
        console.warn('Mobile preview stabilization skipped:',error);
      }
    };
    const setPreviewPaused=(paused)=>{
      try{
        const doc=phone.contentDocument;
        if(!doc) return;
        doc.documentElement.classList.toggle('mobile-preview-paused',paused);
        let pauseStyle=doc.getElementById('mobile-preview-pause-style');
        if(!pauseStyle){
          pauseStyle=doc.createElement('style');
          pauseStyle.id='mobile-preview-pause-style';
          pauseStyle.textContent='.mobile-preview-paused *, .mobile-preview-paused *::before, .mobile-preview-paused *::after{animation-play-state:paused!important}';
          doc.head.appendChild(pauseStyle);
        }
        doc.querySelectorAll('iframe').forEach(frame=>{frame.style.visibility=paused?'hidden':''});
      }catch(error){}
    };

    phone.addEventListener('load',stabilizeDocument);
    document.addEventListener('visibilitychange',()=>{
      setPreviewPaused(document.hidden);
      if(!document.hidden) requestAnimationFrame(stabilizeDocument);
    });
    window.addEventListener('pageshow',()=>requestAnimationFrame(stabilizeDocument));

    loadInPhone(params.get('page')||'index.html');
  </script>
</body>
</html>
